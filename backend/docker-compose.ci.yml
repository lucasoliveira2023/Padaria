version: '3.8'

services:
  backend:
    build:
      context: .
    command: >
      bash -c "
      echo 'Aguardando o banco de dados ficar pronto...';
      until pg_isready -h db -p 5432 -U padaria_user; do
        sleep 1;
      done;
      echo 'Banco de dados pronto! Rodando migrations e testes...';
      python manage.py migrate &&
      python manage.py test --verbosity=2"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env.ci

  db:
    image: postgres:17
    container_name: postgres-ci
    environment:
      POSTGRES_USER: padaria_user
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: padaria_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "padaria_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data_ci:/var/lib/postgresql/data

volumes:
  postgres_data_ci:
